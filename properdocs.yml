site_name: "Proyecto Intermodular"
site_description: "Proyecto Intermodular del Ciclo Formativo de Desarrollo de aplicaciones Web"
site_author: "Alumno DAW - IES Los Albares"

# Selección del tema Read the Docs
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - php
    - bash
    - json
    - html

# Estructura de navegación lateral
nav:
  - Inicio: index.md
  - 1. Instalación y configuración de Git: 01-git.md
  - 2. GitHub CLI: 02-github-cli.md
  - 3. Instalación de Herd y PHP 8.4: 03-herd.md
  - 4. Repositorio misitio: 04-misitio.md
  - 5. Herd y HTTPS: 05-herd-https.md
  - 6. Read the Docs: 06-readthedocs.md
  - 7. Cálculo del sueldo: 07-calculo-sueldo.md


# Opciones adicionales
markdown_extensions:
  - tables
  - codehilite
